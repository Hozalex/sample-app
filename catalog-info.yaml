apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: sample-app
  annotations:
    github.com/project-slug: hozalex/sample-app
    backstage.io/techdocs-ref: dir:.
spec:
  type: service
  lifecycle: experimental
  owner: group:default/developers
  providesApis:
    - sample-app-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: sample-app-api
spec:
  type: openapi
  lifecycle: experimental
  owner: group:default/developers
  definition:
    $text: ./openapi.yaml
